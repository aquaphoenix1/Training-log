name: Sync Google Sheet

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Google Sheet as raw CSV
        run: |
          curl --fail --location --silent --show-error \
            "https://docs.google.com/spreadsheets/d/1R9sHS9H6RNW0e0H4BD3z_Vir7yk4bU5x/export?format=csv&gid=1034788672" \
            -o workouts_raw.csv

      - name: Normalize workout log to JSON
        run: python3 .github/scripts/normalize_workouts.py

      - name: Create compact latest-workouts view
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path("workouts.json").read_text(encoding="utf-8"))
          latest = src["sessions"][-3:]
          out = {
              "source": src["source"],
              "generated_at_utc": src["generated_at_utc"],
              "session_count": len(latest),
              "sessions": latest,
          }
          Path("workouts_latest.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workouts.json workouts_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync training log from Google Sheets"
          git push
